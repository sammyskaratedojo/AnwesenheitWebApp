<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aufnahme der TVL-Karate-Anwesenheiten">
    <meta name="theme-color", content="#141414">
    <title>TVL Karate Anwesenheit</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="manifest" href="manifest.json">
    <script src="script.js" defer></script>
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="errDiv">
        <p>Keine Verbindung zum Server.</p>
        <button><img src="./assets/refresh.svg" alt="Aktualisieren"></button>
    </div>


    <div id="mainScr">
        <h1>Karate Dojo Lenzinghausen</h1>
        <h2>Anwesenheit</h2>

        <section class="existingSessions">
            <h3>Erstellte Sitzungen</h3>
            <div class="caroussell">
                <img src="assets/spinner.png" alt="lädt..." class="spin">

            </div>
        </section>
        
        <section class="createSession">
            <h3>Neue Sitzung erstellen</h3>
            <div class="maindiv">
                <input type="date", id="maindate" class="maindiv_item">
                <select name="Klasse" id="mainclass" class="maindiv_item"></select>
            </div>
            
            <button id="mainbutton" class="mainbutton">Erstellen</button>
        </section>
    </div>


    <div class="editSession">
        <header>
            <button class="back editSessionBtn"><img src="./assets/back.svg" alt="zurück"></button>
            
            <button class="saveSessionEdits editSessionBtn"><img src="./assets/save.svg" alt="speichern"></button>
        </header>
        
        <main>
            <h1>Session name</h1>
            <h2></h2>
            <div class="sessonData">    
                <div class="sessionDesc inputDiv">
                    <label for="session-desc">Beschreibung: </label>
                    <input type="text" name="session-desc" class="inputSessionInfo textInput">
                </div>

                <div class="sessionCreator inputDiv">
                    <label for="session-creator">Ersteller: </label>
                    <input type="text" name="session-creator" class="inputSessionCreator textInput">
                </div>
            </div>
            <list class="profiles_list">
            </list>

            <div class="addProfile">
                <input name="new-profile" type="text" class="textInput inputNewProfile" placeholder="Neues Profil...">
                <p class="suggestion"></p>

                <button><img src="assets/add.svg" alt="Profil hinzufügen"></button>
            </div>

        </main>
    </div>
</body>
</html>
